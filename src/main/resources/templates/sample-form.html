<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Sample Registration Form</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f1f5f9; color:#0f172a; display:flex; justify-content:center; padding:2rem; }
    .card { background:#fff; padding:2rem; border-radius:12px; width:420px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    h1 { font-size:1.3rem; margin:0 0 1rem; }
    label { display:block; font-size:.85rem; font-weight:600; margin:.7rem 0 .2rem; }
    input, select, textarea { width:100%; padding:.55rem; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size:.95rem; }
    textarea { min-height:80px; resize:vertical; }
    button { margin-top:1rem; width:100%; padding:.65rem; border:0; border-radius:5px; background:#16a34a; color:#fff; font-weight:600; font-size:1rem; cursor:pointer; }
    .banner { background:#dcfce7; color:#166534; padding:.6rem; border-radius:6px; margin-bottom:1rem; font-size:.9rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>Sample Registration Form</h1>
  <div class="banner" th:if="${submitted}">Form submitted successfully!</div>
  <!-- This form is now a redirect shell for the real Campus360 admission page -->
  <form action="https://hmtcampus360v2.net/AdminPanel/Admission_new/personal_profile.php" method="post">
    <!-- csvColumn=firstName, locatorType=id, locatorValue=first-name -->
    <label for="first-name">First name</label>
    <input id="first-name" name="firstName" type="text"/>

    <!-- csvColumn=lastName, locatorType=id, locatorValue=last-name -->
    <label for="last-name">Last name</label>
    <input id="last-name" name="lastName" type="text"/>

    <!-- csvColumn=email, locatorType=name, locatorValue=email -->
    <label for="email-field">Email</label>
    <input id="email-field" name="email" type="email"/>

    <!-- csvColumn=phone, locatorType=css, locatorValue=input.phone-field -->
    <label for="phone-field">Phone</label>
    <input id="phone-field" class="phone-field" name="phone" type="text"/>

    <!-- csvColumn=country, locatorType=xpath, locatorValue=//select[@id='country'] -->
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">-- select --</option>
      <option value="UK">UK</option>
      <option value="USA">USA</option>
      <option value="India">India</option>
    </select>

    <!-- csvColumn=comments, locatorType=class, locatorValue=comment-box -->
    <label for="comments">Comments</label>
    <textarea id="comments" class="comment-box" name="comments"></textarea>

    <!-- default submit locator used by the flow: css button[type=submit] -->
    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
